name: Tutorial wording cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tutorial-copy-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply no-negative-echo cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected text: {label}")
              return text.replace(old, new)

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          replacements = [
              (
                  '> **部署前：只看 GitHub 这一页。部署后：登录自己网站的 `/admin`，点击右上角“使用教程”，可打开同版教程。**',
                  '> **部署前：只看 GitHub 这一页。部署后：登录自己网站的 `/admin`，点击右上角“使用教程”，可打开后台教程。**',
                  "README tutorial wording",
              ),
              (
                  '> 模板不再提供公开 `/guide` 页面，避免所有学生反复访问老师的 Cloudflare Worker。GitHub 承担部署前的公开说明；部署成功后，每个学生的网站流量由自己的 Cloudflare 账号承担。',
                  '> GitHub 承担部署前的公开说明；部署成功后，每个学生的网站流量由自己的 Cloudflare 账号承担。',
                  "README public guide history",
              ),
              (
                  '- **学生自己的前台 `/`**：公开作品集，给招聘方、客户和同学查看。',
                  '- **学生自己的前台 `/`**：默认公开；也可以在后台启用二维码限制访问。',
                  "README front access logic",
              ),
              (
                  '- **后台“使用教程”**：登录管理员后台后才出现，不提供公共教程网页。',
                  '- **后台“使用教程”**：登录管理员后台后出现，直接打开后台教程。',
                  "README admin tutorial logic",
              ),
              (
                  '- 打开与 GitHub 本页同版的操作说明；',
                  '- 打开后台版操作说明，并可跳转到 GitHub 完整指南；',
                  "README same-version claim",
              ),
              (
                  '- 教程不是公共路由，未登录管理员看不到入口。',
                  '- 教程入口只在管理员登录后显示。',
                  "README tutorial access wording",
              ),
              (
                  '### `/guide` 打不开\n\n这是正确行为。公共 `/guide` 已删除；部署前看 GitHub README，部署后从管理员后台打开教程。\n\n',
                  '',
                  "README obsolete route FAQ",
              ),
              (
                  '- [ ] `/guide` 不再是公共页面。\n',
                  '',
                  "README obsolete route checklist",
              ),
          ]
          for old, new, label in replacements:
              readme = replace_required(readme, old, new, label)
          readme_path.write_text(readme, encoding="utf-8")

          guide_path = Path("app/admin/admin-guide-center.tsx")
          guide = guide_path.read_text(encoding="utf-8")
          guide_replacements = [
              (
                  '在 GitHub 打开同版指南 ↗',
                  '打开 GitHub 完整指南 ↗',
                  "admin GitHub link",
              ),
              (
                  '<li>作品前台公开；后台和本教程受管理员密码控制。</li>',
                  '<li>作品前台默认公开，也可以在后台启用二维码限制访问；后台和本教程受管理员密码控制。</li>',
                  "admin front access logic",
              ),
              (
                  '              <li>模板不再提供公开 `/guide` 页面。</li>\n',
                  '',
                  "admin obsolete route wording",
              ),
          ]
          for old, new, label in guide_replacements:
              guide = replace_required(guide, old, new, label)
          guide_path.write_text(guide, encoding="utf-8")
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md app/admin/admin-guide-center.tsx
          git commit -m "Clean final tutorial wording"
          git push
