name: Verify Key Areas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-key-areas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install
        run: npm ci

      - name: Admin and guide regression checks
        run: node --experimental-strip-types --test tests/admin-regressions.test.mjs tests/media-crop.test.mjs tests/hero-layout.test.mjs tests/agent-deployment-package.test.mjs

      - name: Lint changed admin surfaces
        run: npx eslint app/admin/admin-client.tsx app/admin/admin-guide-center.tsx app/admin/admin-guide-step-two.tsx app/admin/admin-upgrade-center.tsx app/admin/admin-interaction-enhancements.tsx app/admin/media-crop-editor.tsx app/admin/page.tsx
