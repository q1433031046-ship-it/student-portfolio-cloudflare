name: Complete Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Deployment script syntax
        run: |
          bash -n scripts/*.sh
          node --check scripts/*.mjs

      - name: Migration metadata is current
        run: |
          npm run db:generate
          migration_changes="$(git status --porcelain --untracked-files=all -- drizzle)"
          if [[ -n "$migration_changes" ]]; then
            printf '%s\n' "$migration_changes"
            exit 1
          fi

      - name: Full tests and single production build
        run: npm test

      - name: Cloudflare deployment dry run
        run: |
          npx --no-install wrangler deploy --dry-run --keep-vars --config wrangler.jsonc
          git diff --exit-code -- wrangler.jsonc

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit
